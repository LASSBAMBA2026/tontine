<style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Concept : carnet de caisse de quartier, lecture rapide sur téléphone, montants en FCFA, bascule clair/sombre */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#17231F; --ink2:#51605A; --line:#DCE2DE;
  --accent:#0E5A47; --accent-ink:#FFFFFF; --accent-soft:#DDEEE7;
  --gold:#8A5A0B; --gold-soft:#F6E9CF; --beige:#F7F2E8;
  --bad:#B3261E; --bad-soft:#F8DEDB; --ok:#1E6B38; --ok-soft:#DCF0E1;
  --font-d:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-b:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --surface:#17221E; --ink:#E8EFEB; --ink2:#A3B4AC; --line:#2B3A34;
    --accent:#4FC19B; --accent-ink:#072019; --accent-soft:#1C3A30;
    --gold:#E3B35A; --gold-soft:#3A2E15; --beige:#2B2720;
    --bad:#F28B82; --bad-soft:#3D1F1C; --ok:#6FCF8D; --ok-soft:#1B3524; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#17221E; --ink:#E8EFEB; --ink2:#A3B4AC; --line:#2B3A34;
  --accent:#4FC19B; --accent-ink:#072019; --accent-soft:#1C3A30;
  --gold:#E3B35A; --gold-soft:#3A2E15; --beige:#2B2720;
  --bad:#F28B82; --bad-soft:#3D1F1C; --ok:#6FCF8D; --ok-soft:#1B3524; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700;line-height:1.1}
h2{font-size:19px;font-weight:650}
h3{font-size:16px;font-weight:650}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px var(--font-d);flex:none}
.brand span.logo{display:grid;color:var(--accent-ink);font:700 15px var(--font-d);max-width:none;overflow:visible}
.brand b{font:700 17px var(--font-d);display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.ctx{display:flex;gap:10px;align-items:center;margin:2px 0 14px}
.ctx select{flex:1;min-width:0}
.ptitle{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.ptitle h1{flex:1;min-width:0}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px 18px 16px}
.hero small{opacity:.85;font-size:13px}
.hero .big{font:700 34px/1.1 var(--font-d);margin:4px 0 12px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.hero .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:8px;opacity:.92;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{color:var(--ink2);font-size:12.5px;display:block}
.tile b{font:700 20px var(--font-d);font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.tile.warn b{color:var(--bad)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 -4px}
.sec h2{font-size:17px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--accent-soft)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.amt{font:650 15px var(--font-d);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 14px var(--font-d);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:20px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.mute{background:var(--line);color:var(--ink2)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:42px}
.btn.alt{background:var(--surface);color:var(--accent)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:4px}
input,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=file]{padding:8px}
.fld{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--ink2);border-radius:10px}
.nav button[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.ic{width:22px;height:22px}
.empty{text-align:center;padding:36px 12px;color:var(--ink2);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{color:var(--ink)}
.note{font-size:13px;color:var(--ink2)}
.sheetwrap[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px}
.sheet .x{border:0;background:var(--line);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--ink2)}
.sbody{overflow:auto;padding:4px 0 calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw;font-size:14px}
.toast[hidden]{display:none}
.auth .card{background:var(--beige)}
.auth{max-width:420px;margin:0 auto;padding:40px 0;display:flex;flex-direction:column;gap:18px}
.err{color:var(--bad);font-size:13.5px;min-height:18px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.receipt{background:var(--surface);border:1px dashed var(--ink2);border-radius:10px;padding:14px 16px;font:14px/1.7 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.step{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font:700 13px var(--font-d);flex:none}
.step.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nextcard{border:2px solid var(--accent);background:var(--surface)}
.nextcard .nm{font:700 24px/1.15 var(--font-d)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}}
</style>


</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheetwrap" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- Données : une collection par table du MLD ---------- */
var COLL=['membres','tontines','types','adhesions','cotisations','tours','notifications','utilisateurs','journal'];
var S={data:{},db:null,dl:null,mode:'loading',user:null,view:'accueil',tid:null,q:'',cseg:'hist',sheet:null,
  rep:{mode:'jour',date:'',month:''},fail:0,lock:0,confirmClear:false,authErr:'',authTel:''};
COLL.forEach(function(c){S.data[c]={};});
var LKEY='tontine-local-v1';

/* ---------- Utilitaires ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function vals(c){return Object.keys(S.data[c]).map(function(k){return S.data[c][k];});}
function sum(a,f){return a.reduce(function(s,x){return s+(f?f(x):x);},0);}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function addMonths(s,n){var d=parse(s);d.setMonth(d.getMonth()+n);return iso(d);}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5);}
function fdate(s){if(!s)return '—';return parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}
function fmonth(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});}
function ftime(ts){return new Date(ts).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function F(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n)).replace(/[  ]/g,' ')+' F';}
function Fp(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n)).replace(/[  ]/g,' ')+' F';}
function normPhone(s){return String(s||'').replace(/[^\d+]/g,'');}
function initials(m){return ((m.prenom||'?')[0]+(m.nom||'')[0]).toUpperCase();}

/* ---------- Règles métier ---------- */
function periods(t,start,end){
  end=end||today(); if(t.date_fin&&end>t.date_fin)end=t.date_fin; if(end<start)return 0;
  if(t.frequence==='quotidienne')return diffDays(start,end)+1;
  if(t.frequence==='cinq_jours')return Math.floor(diffDays(start,end)/5)+1;
  if(t.frequence==='hebdomadaire')return Math.floor(diffDays(start,end)/7)+1;
  var a=parse(start),b=parse(end),m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
  if(b.getDate()<a.getDate())m--; return m+1;
}
function T(){return vals('tontines').sort(function(a,b){return b.date_debut.localeCompare(a.date_debut);});}
function curT(){var l=T();return l.find(function(t){return t.id===S.tid;})||l[0]||null;}
function adhesionsOf(tid){return vals('adhesions').filter(function(a){return a.id_tontine===tid;}).sort(function(a,b){return a.ordre_passage-b.ordre_passage;});}
function mem(id){return S.data.membres[id];}
function mname(m){return m?m.prenom+' '+m.nom:'Membre supprimé';}
function isActive(a){var m=mem(a.id_membre);return !!m&&m.statut==='actif';}
function typeAmt(a){var ty=S.data.types[a.id_type];return ty?ty.montant:0;}
function perAmt(a){return typeAmt(a)*nbT(a);}
function paidBy(aid){return sum(vals('cotisations').filter(function(c){return c.id_adhesion===aid;}),function(c){return c.montant;});}
function startOf(a,t){var m=mem(a.id_membre);return m&&m.date_adhesion>t.date_debut?m.date_adhesion:t.date_debut;}
function due(a,t){return periods(t,startOf(a,t))*perAmt(a);}
function solde(a,t){return due(a,t)-paidBy(a.id);}
function cotisOf(t){var ids={};adhesionsOf(t.id).forEach(function(a){ids[a.id]=1;});return vals('cotisations').filter(function(c){return ids[c.id_adhesion];});}
function potOf(t){return sum(adhesionsOf(t.id).filter(isActive),perAmt);}
function toursOf(tid){return vals('tours').filter(function(x){return x.id_tontine===tid;}).sort(function(a,b){return b.date_tour.localeCompare(a.date_tour);});}
function nbT(a){return a.nb_tours>0?a.nb_tours:1;}
function gotT(a){return toursOf(a.id_tontine).filter(function(x){return x.id_membre===a.id_membre;}).length;}
function toursOptions(sel){var o='';for(var i=1;i<=6;i++)o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+' tour'+(i>1?'s':'')+'</option>';return o;}
function nextBenef(t){
  return adhesionsOf(t.id).find(function(a){return isActive(a)&&gotT(a)<nbT(a);})||null;
}
function stepOf(t){return t.frequence==='quotidienne'?function(d,k){return addDays(d,k);}:t.frequence==='cinq_jours'?function(d,k){return addDays(d,5*k);}:t.frequence==='hebdomadaire'?function(d,k){return addDays(d,7*k);}:function(d,k){return addMonths(d,k);};}
function nextNumero(){return Math.max.apply(null,[0].concat(vals('membres').map(function(m){return m.numero||0;})))+1;}
function isAdmin(){return !!S.user&&S.user.role==='admin';}
var FREQ={cinq_jours:'Tous les 5 jours',quotidienne:'Quotidienne',hebdomadaire:'Hebdomadaire',mensuelle:'Mensuelle'};
var PER={cinq_jours:'5 jours',quotidienne:'jour',hebdomadaire:'semaine',mensuelle:'mois'};
var MODE={especes:'Espèces',mobile_money:'Mobile money'};

/* ---------- Persistance (db partagée, sinon stockage local) ---------- */
var queues={},rafId=0;
function onDbErr(e){
  var code=e&&e.code||'';
  toast(code==='quota_exceeded'?'Espace de stockage plein.':code==='invalid_argument'?'Enregistrement refusé : droits insuffisants.':'Enregistrement impossible pour le moment.');
}
function chain(key,fn){var p=(queues[key]||Promise.resolve()).then(fn).catch(onDbErr);queues[key]=p;return p;}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S.data));}catch(e){}}
function persist(c,obj){
  S.data[c][obj.id]=obj;
  if(S.db){var copy=JSON.parse(JSON.stringify(obj));chain(c+'/'+obj.id,function(){return S.db.collection(c).doc(obj.id).set(copy);});}
  else saveLocal();
  schedule();
}
function drop(c,id){
  delete S.data[c][id];
  if(S.db){chain(c+'/'+id,function(){return S.db.collection(c).doc(id).delete();});}
  else saveLocal();
  schedule();
}
function logA(action,detail){
  persist('journal',{id:uid(),ts:Date.now(),user:S.user?S.user.telephone:'',action:action,detail:detail||''});
}
function schedule(){
  if(rafId)return;
  rafId=requestAnimationFrame(function(){
    rafId=0;
    var ae=document.activeElement;
    if(!S.user&&ae&&ae.closest&&ae.closest('#app form'))return;
    render(); if(S.sheet&&S.sheet.live)paintSheet();
  });
}
function subscribeAll(db){
  var pending=COLL.length;
  function done(){pending--;if(pending===0)ready();}
  COLL.forEach(function(c){
    var first=true;
    var ref=c==='journal'?db.collection(c).orderBy('ts','desc').limit(200):db.collection(c);
    ref.onSnapshot(function(snap){
      var o={};snap.docs.forEach(function(d){var v=d.data();if(v)o[d.id]=Object.assign({},v,{id:d.id});});
      S.data[c]=o;
      if(first){first=false;done();}else schedule();
    },function(e){onDbErr(e);if(first){first=false;done();}});
  });
}
function ready(){if(S.mode==='ready')return;S.mode='ready';render();}
async function init(){
  S.rep.date=today();S.rep.month=today().slice(0,7);
  render();
  var db=null;
  try{
    db=await Promise.race([window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null),new Promise(function(r){setTimeout(function(){r(null);},9000);})]);
  }catch(e){db=null;}
  try{S.dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){S.dl=null;}
  if(db){S.db=db;subscribeAll(db);setTimeout(ready,8000);}
  else{
    try{var raw=localStorage.getItem(LKEY);if(raw){var d=JSON.parse(raw);COLL.forEach(function(c){S.data[c]=d[c]||{};});}}catch(e){}
    S.mode='local';render();
  }
}

/* ---------- Sécurité : compte, PIN, session ---------- */
async function hashPin(tel,pin){
  var s='tontine|'+tel+'|'+pin;
  try{
    if(window.crypto&&crypto.subtle){
      var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
    }
  }catch(e){}
  return 'b64:'+btoa(unescape(encodeURIComponent(s)));
}

function vAccueil(){
  var t=curT(); if(!t)return title('Tableau de bord')+emptyHome();
  var ads=adhesionsOf(t.id),act=ads.filter(isActive),cot=cotisOf(t);
  var total=sum(cot,function(c){return c.montant;});
  var mois=sum(cot.filter(function(c){return c.date_paiement.slice(0,7)===today().slice(0,7);}),function(c){return c.montant;});
  var retards=act.filter(function(a){return solde(a,t)>0;}).sort(function(a,b){return solde(b,t)-solde(a,t);});
  var aPayer=sum(retards,function(a){return solde(a,t);});
  var gain=sum(cot,function(c){return c.frais_beneficiaire||0;});
  var gainTotal=sum(vals('cotisations'),function(c){return c.frais_beneficiaire||0;});
  var dueAll=sum(act,function(a){return due(a,t);}),paidAct=sum(act,function(a){return paidBy(a.id);});
  var pct=dueAll?Math.max(0,Math.min(100,paidAct/dueAll*100)):0;
  var nb=nextBenef(t);
  var h=title('Tableau de bord');
  h+='<div class="stack"><div class="hero"><small>Total cotisé · '+esc(t.nom)+'</small><div class="big">'+F(total)+'</div><div class="bar" role="img" aria-label="'+Math.round(pct)+' % des cotisations dues sont payées"><i style="width:'+pct+'%"></i></div>'+
    '<div class="meta"><span>'+Math.round(pct)+' % des cotisations dues</span><span>'+FREQ[t.frequence]+' · '+F(t.montant)+'</span></div></div>';
  h+='<div class="tiles"><div class="tile"><small>Membres actifs</small><b>'+act.length+' / '+ads.length+'</b></div>'+
     '<div class="tile"><small>Cotisé ce mois</small><b>'+F(mois)+'</b></div>'+
     '<div class="tile'+(aPayer?' warn':'')+'"><small>Montant à payer</small><b>'+F(aPayer)+'</b></div>'+
     '<div class="tile"><small>Gain tontinier choisi</small><b>'+F(gain)+'</b></div>'+
     '<div class="tile"><small>Gain tontinier total</small><b>'+F(gainTotal)+'</b></div>'+
     '<div class="tile'+(retards.length?' warn':'')+'"><small>Retards</small><b>'+retards.length+'</b></div></div>';
  if(!ads.length)h+='<div class="card"><h3>Aucun participant</h3><p class="note" style="margin:4px 0 10px">Ajoutez des membres à cette tontine pour suivre leurs cotisations.</p><div class="btns"><button class="btn sm" data-act="m-new">Nouveau membre</button><button class="btn sm alt" data-act="t-open" data-id="'+t.id+'">Gérer les participants</button></div></div>';
  else{
    h+='<div class="card nextcard"><small class="note">Prochain bénéficiaire</small>';
    if(nb){var m=mem(nb.id_membre);h+='<div class="row" style="margin:8px 0">'+av(m)+'<div class="grow"><div class="nm">'+esc(mname(m))+'</div><div class="note">Passage n° '+nb.ordre_passage+' · cagnotte estimée '+F(potOf(t))+'</div></div></div>'+
      (isAdmin()?'<button class="btn" data-act="tour-new">Enregistrer le tour</button>':'');}
    else h+='<p style="margin-top:6px">Tous les tours prévus ont été versés : le cycle est terminé.</p>';
    h+='</div>';
  }
  if(retards.length){
    h+='<div class="sec"><h2>Retards de cotisation</h2></div><div class="list">'+retards.slice(0,6).map(function(a){var m=mem(a.id_membre);
      return '<div class="item">'+av(m)+'<div class="grow"><div class="t">'+esc(mname(m))+'</div><div class="s">'+esc(m.telephone)+'</div></div><div><div class="amt" style="color:var(--bad)">'+F(solde(a,t))+'</div>'+
      '<div class="btns" style="margin-top:6px;justify-content:flex-end"><button class="btn sm alt" data-act="relance" data-id="'+a.id+'">Relancer</button><button class="btn sm" data-act="cot-new" data-id="'+a.id+'">Cotiser</button></div></div></div>';}).join('')+'</div>';
  }

  h+='<div class="sec"><h2>Derniers versements</h2><button class="back" data-act="nav" data-v="cotisations">Tout voir</button></div>';
  h+=last.length?'<div class="list">'+last.map(cotRow).join('')+'</div>':'<div class="card note">Aucune cotisation enregistrée pour le moment.</div>';
  return h+'</div>';

/* ---------- Rapports ---------- */
function reportData(){
  var t=curT();if(!t)return null;
  var mode=S.rep.mode,key=mode==='jour'?S.rep.date:S.rep.month;
  var inR=function(d){return mode==='jour'?d===key:d.slice(0,7)===key;};
  var ads=adhesionsOf(t.id);
  var rows=ads.map(function(a){
    var cs=vals('cotisations').filter(function(c){return c.id_adhesion===a.id&&inR(c.date_paiement);});
    return {nom:mname(mem(a.id_membre)),nb:cs.length,montant:sum(cs,function(c){return c.montant;}),solde:solde(a,t)};
  });
  var tours=toursOf(t.id).filter(function(x){return inR(x.date_tour);});
  return {t:t,key:key,label:mode==='jour'?fdate(key):fmonth(key),rows:rows,tours:tours,total:sum(rows,function(r){return r.montant;}),nb:sum(rows,function(r){return r.nb;}),recu:sum(tours,function(x){return x.montant_recu;})};
}

  h+='<div class="btns"><button class="btn" data-act="exp-pdf">Exporter en PDF</button><button class="btn alt" data-act="exp-csv">Exporter pour Excel</button></div></div>';
  return h;
}
function plainDownload(name,data){
  try{
    var ext=name.split('.').pop().toLowerCase(),types={csv:'text/csv;charset=utf-8',json:'application/json',pdf:'application/pdf'};
    var blob=data instanceof Blob?data:new Blob([data],{type:types[ext]||'application/octet-stream'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);toast('Fichier téléchargé.');
  }catch(e){toast('Le fichier n\u2019a pas pu être créé.');}
}
async function saveFile(name,data){
  if(!S.dl){plainDownload(name,data);return;}
  try{await S.dl.save({filename:name,data:data});toast('Fichier prêt.');}
  catch(e){if(e&&e.code!=='declined')toast('Le fichier n’a pas pu être enregistré.');}
}
function exportCsv(){
  var r=reportData();if(!r)return;
  var lines=[['Rapport',r.t.nom,r.label].join(';'),'',['Membre','Paiements','Montant (F)','Solde dû (F)'].join(';')];
  r.rows.forEach(function(x){lines.push([x.nom,x.nb,x.montant,Math.max(0,x.solde)].join(';'));});
  lines.push(['Total',r.nb,r.total,''].join(';'));
  saveFile('rapport-'+(S.rep.mode==='jour'?S.rep.date:S.rep.month)+'.csv','﻿'+lines.join('\r\n'));
}
function exportPdf(){
  var r=reportData();if(!r)return;
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('Le module PDF n’a pas pu se charger.');return;}
  var doc=new window.jspdf.jsPDF();
  doc.setFontSize(16);doc.text('Rapport '+(S.rep.mode==='jour'?'journalier':'mensuel')+' - '+r.t.nom,14,18);
  doc.setFontSize(11);doc.text(r.label+'   |   Encaissé : '+Fp(r.total)+'   |   '+r.nb+' paiement(s)',14,26);
  var body=r.rows.map(function(x){return [x.nom,String(x.nb),Fp(x.montant),Fp(Math.max(0,x.solde))];});
  if(typeof doc.autoTable==='function')doc.autoTable({startY:32,head:[['Membre','Paiements','Montant','Solde dû']],body:body,styles:{fontSize:10}});
  else body.forEach(function(b,i){doc.text(b.join('   '),14,36+i*7);});
  saveFile('rapport-'+(S.rep.mode==='jour'?S.rep.date:S.rep.month)+'.pdf',doc.output('blob'));
}

/* ---------- Feuilles (fenêtres du bas) ---------- */
function openSheet(ttl,body,live){S.sheet={title:ttl,body:body,live:!!live};paintSheet();}
function closeSheet(){S.sheet=null;paintSheet();}
function paintSheet(){
  var el=$('#sheet');
  if(!S.sheet){el.innerHTML='';el.hidden=true;return;}
  var old=el.querySelector('.sbody'),st=old?old.scrollTop:0;
  var b=typeof S.sheet.body==='function'?S.sheet.body():S.sheet.body;
  el.hidden=false;
  el.innerHTML='<div class="scrim" data-act="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(S.sheet.title)+'"><header><h2>'+esc(S.sheet.title)+'</h2><button class="x" data-act="close" aria-label="Fermer">×</button></header><div class="sbody">'+b+'</div></section>';
  var nb=el.querySelector('.sbody');if(nb&&st)nb.scrollTop=st;
}
var toastT=0;
function toast(msg){var el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},3200);}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast('Copié.');return;}catch(e){}
  try{var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();toast(ok?'Copié.':'Copie impossible : sélectionnez le texte à la main.');}catch(e){toast('Copie impossible : sélectionnez le texte à la main.');}
}
function showErr(msg){var e=$('#f-err');if(e)e.textContent=msg;}
function resizePhoto(file){
  return new Promise(function(res){
    if(!file||!file.size){res(null);return;}
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();im.onload=function(){
      var s=96,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d'),m=Math.min(im.width,im.height);
      x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',0.72));};im.onerror=function(){res(null);};im.src=fr.result;};
    fr.onerror=function(){res(null);};fr.readAsDataURL(file);
  });
}

function okId(v){return typeof v==='string'&&/^[A-Za-z0-9_-]{1,60}$/.test(v);}
function validRec(c,v){
  for(var k in v){if((k==='id'||k.indexOf('id_')===0)&&!okId(v[k]))return false;}
  if(c==='notifications')return !!NT[v.type]&&typeof v.date_envoi==='string'&&typeof v.message==='string';
  if(c==='cotisations')return !!MODE[v.mode_paiement]&&typeof v.date_paiement==='string'&&isFinite(v.montant);
  if(c==='tours')return typeof v.date_tour==='string'&&isFinite(v.montant_recu);
  if(c==='tontines')return !!FREQ[v.frequence]&&typeof v.date_debut==='string'&&typeof v.nom==='string';
  if(c==='membres')return (v.statut==='actif'||v.statut==='inactif')&&typeof v.nom==='string'&&typeof v.prenom==='string'&&typeof v.date_adhesion==='string';
  if(c==='adhesions')return isFinite(v.ordre_passage);
  if(c==='types')return isFinite(v.montant);
  return false;
}
function importBackup(file){
  if(!file)return;
  var fr=new FileReader();
  fr.onerror=function(){toast('Lecture du fichier impossible.');};
  fr.onload=function(){
    var d;try{d=JSON.parse(fr.result);}catch(e){toast('Ce fichier n\u2019est pas une sauvegarde valide.');return;}
    if(!d||typeof d!=='object'||!(d.membres||d.tontines||d.cotisations)){toast('Ce fichier n\u2019est pas une sauvegarde de tontine.');return;}
    var n=0,skip=0;
    ['types','membres','tontines','adhesions','cotisations','tours','notifications'].forEach(function(c){
      var o=d[c];if(!o||typeof o!=='object')return;
      Object.keys(o).forEach(function(k){
        var v=o[k];if(!v||typeof v!=='object')return;
        v=Object.assign({},v,{id:v.id||k});
        if(!validRec(c,v)){skip++;return;}
        persist(c,v);n++;
      });
    });
    logA('Sauvegarde importée',n+' élément(s)'+(skip?', '+skip+' ignoré(s)':''));
    toast(n+' élément(s) importé(s)'+(skip?', '+skip+' ignoré(s)':'')+'.');
  };
  fr.readAsText(file);
}
function relanceOne(a,t){var m=mem(a.id_membre);notify(m.id,'retard','Bonjour '+m.prenom+', il vous reste '+Fp(solde(a,t))+' à cotiser pour « '+t.nom+' ». Merci de régulariser.');}
function moveAdh(id,dir){
  var a=S.data.adhesions[id];if(!a)return;
  var l=adhesionsOf(a.id_tontine),i=l.findIndex(function(x){return x.id===id;}),o=l[i+dir];if(!o)return;
  var pa=a.ordre_passage,po=o.ordre_passage;
  persist('adhesions',Object.assign({},a,{ordre_passage:po}));persist('adhesions',Object.assign({},o,{ordre_passage:pa}));
}

var FORMS={
  setup:async function(fd){
    var tel=normPhone(fd.get('tel')),p1=String(fd.get('pin')),p2=String(fd.get('pin2'));S.authTel=tel;
    if(tel.length<8){S.authErr='Numéro de téléphone trop court.';render();return;}

    if(p1!==p2){S.authErr='Les deux PIN sont différents.';render();return;}
    seedTypes();
    var u={id:uid(),telephone:tel,code_pin:await hashPin(tel,p1),role:'admin',id_membre:null};
    persist('utilisateurs',u);S.user=sessionFor(u);S.authErr='';S.authTel='';bump();logA('Compte administrateur créé',tel);render();
  },
  login:async function(fd){
    var now=Date.now();
    if(S.lock>now){S.authErr='Trop d’essais. Patientez '+Math.ceil((S.lock-now)/1000)+' secondes.';render();return;}
    var tel=normPhone(fd.get('tel')),pin=String(fd.get('pin')),u=userOf(tel);S.authTel=tel;

    S.fail=0;S.authErr='';S.authTel='';S.user=sessionFor(u);S.view='accueil';bump();render();
  },
  membre:async function(fd,form){

  tontine:function(fd,form){

  'adh-add':function(fd,form){

    var a={id:uid(),ordre_passage:ordre,id_membre:String(fd.get('id_membre')),id_tontine:tid,id_type:String(fd.get('id_type')),nb_tours:Number(fd.get('nb_tours'))||1};

  },
  cotis:function(fd,form){
    var m=Number(fd.get('montant')),a=S.data.adhesions[String(fd.get('id_adhesion'))];
    if(!a||!(m>0)){showErr('Choisissez un membre et un montant valide.');return;}

      persist('cotisations',nc);logA('Cotisation modifiée',mname(mem(a.id_membre))+' · '+Fp(m)+' · '+(old.recu||''));toast('Cotisation corrigée.');
      A.receipt({dataset:{id:nc.id}});return;
    }
    var c={id:uid(),date_paiement:d,montant:m,mode_paiement:String(fd.get('mode_paiement')),frais_beneficiaire:Math.max(0,Number(fd.get('frais_beneficiaire'))||0),recu:'R-'+d.replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),id_adhesion:a.id};

  tour:function(fd,form){

    var t=old?S.data.tontines[old.id_tontine]:curT(),idm=String(fd.get('id_membre')),m=Number(fd.get('montant_recu'));
    if(!t||!(m>0)){showErr('Montant invalide.');return;}
    var ad=adhesionsOf(t.id).find(function(a){return a.id_membre===idm;});

    if(old){
      persist('tours',Object.assign({},old,{id_membre:idm,date_tour:String(fd.get('date_tour')),montant_recu:m,periodicite:String(fd.get('periodicite'))}));
      logA('Tour modifié',mname(mem(old.id_membre))+(old.id_membre!==idm?' → '+mname(mem(idm)):'')+' · '+Fp(m));closeSheet();toast('Tour corrigé.');return;
    }
    var x={id:uid(),date_tour:String(fd.get('date_tour')),montant_recu:m,periodicite:String(fd.get('periodicite')),confirme:false,id_tontine:t.id,id_membre:idm};
    persist('tours',x);var mm=mem(idm);
    notify(idm,'tour','Bonjour '+mm.prenom+', c’est votre tour : vous recevez '+Fp(m)+' pour « '+t.nom+' ».');
    logA('Tour enregistré',mname(mm)+' · '+Fp(m));closeSheet();toast('Tour enregistré.');
  },
  user:async function(fd){
    var tel=normPhone(fd.get('tel')),pin=String(fd.get('pin')),idm=String(fd.get('id_membre')||'');
    if(tel.length<8){showErr('Numéro de téléphone trop court.');return;}
    if(!/^\d{4,6}$/.test(pin)){showErr('Le PIN doit contenir 4 à 6 chiffres.');return;}
    if(userOf(tel)){showErr('Un compte existe déjà avec ce numéro.');return;}
    var u={id:uid(),telephone:tel,code_pin:await hashPin(tel,pin),role:String(fd.get('role')),id_membre:idm||null};
    persist('utilisateurs',u);logA('Compte créé',tel+' ('+u.role+')');closeSheet();toast('Compte créé.');
  },
  pin:async function(fd,form){
    var u=S.data.utilisateurs[S.user.id],n1=String(fd.get('n1')),n2=String(fd.get('n2'));
    if(!u)return;
    if(u.code_pin!==await hashPin(u.telephone,String(fd.get('old')))){showErr('L’ancien PIN est incorrect.');return;}
    if(!/^\d{4,6}$/.test(n1)){showErr('Le PIN doit contenir 4 à 6 chiffres.');return;}
    if(n1!==n2){showErr('Les deux PIN sont différents.');return;}
    persist('utilisateurs',Object.assign({},u,{code_pin:await hashPin(u.telephone,n1)}));logA('PIN modifié','');form.reset();toast('PIN modifié.');
  }
};

  var C=[[2,0,5000],[2,1,5000],[1,0,5000],[1,1,5000],[1,2,20000],[1,3,5000],[0,0,5000],[0,1,5000],[0,2,20000]];

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  bump();
  var el=e.target.closest('[data-act]');if(!el)return;
  var fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el);}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  var fn=FORMS[f.dataset.form];if(!fn)return;
  var btn=f.querySelector('button:not([type=button])');if(btn)btn.disabled=true;
  Promise.resolve(fn(new FormData(f),f)).catch(function(){toast('Une erreur est survenue.');}).then(function(){if(btn&&document.body.contains(btn))btn.disabled=false;});
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-change]');if(!el)return;
  var k=el.dataset.change;
  if(k==='tid'){S.tid=el.value;render();}
  else if(k==='rdate'){S.rep.date=el.value||today();render();}
  else if(k==='rmonth'){S.rep.month=el.value||today().slice(0,7);render();}
  else if(k==='adh-type'){var a=S.data.adhesions[el.dataset.id];if(a){persist('adhesions',Object.assign({},a,{id_type:el.value}));logA('Type de cotisation modifié',mname(mem(a.id_membre)));}}
  else if(k==='adh-tours'){var a2=S.data.adhesions[el.dataset.id];if(a2){persist('adhesions',Object.assign({},a2,{nb_tours:Number(el.value)||1}));logA('Nombre de tours modifié',mname(mem(a2.id_membre))+' : '+el.value);}}
  else if(k==='import'){importBackup(el.files&&el.files[0]);el.value='';}
  else if(k==='cot-pick'){var o=el.options[el.selectedIndex],inp=$('#c-m');if(o&&inp&&!(el.form&&el.form.dataset.id))inp.value=o.dataset.m||'';}
  else if(k==='user-pick'){var o2=el.options[el.selectedIndex],ti=$('#u-t'),ro=$('#u-r');if(o2&&o2.dataset.tel&&ti){ti.value=o2.dataset.tel;if(ro)ro.value='membre';}}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.dataset&&e.target.dataset.input==='q'){S.q=e.target.value;render();}
  bump();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet)closeSheet();bump();});

init();
})();
